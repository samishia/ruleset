# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 机场订阅
proxy-providers:
  Airport1:
    url: ""
    type: http
    interval: 43200
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 300
    proxy: 🎯 全球直连
    override:
      skip-cert-verify: true
      udp: false
      additional-prefix: "A1-"
    exclude-filter: "x4|x2"
  Airport2:
    url: ""
    type: http
    interval: 43200
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 300
    proxy: 🎯 全球直连
    override:
     skip-cert-verify: true
     udp: false
     additional-prefix: "A2-"
  Airport3:
    url: ""
    type: http
    interval: 43200
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 300
    proxy: 🎯 全球直连
    override:
      skip-cert-verify: true
      udp: true
      additional-prefix: "A3-"
global-ua: clash-verge/v2.3.1

# 节点信息
proxies:
  - {name: 🎯 全球直连, type: direct}

# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
bind-address: "*"
ipv6: false
mode: rule
tcp-concurrent: true
log-level: info
find-process-mode: 'off'
# interface-name: en0
keep-alive-idle: 600
keep-alive-interval: 60
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true

# 嗅探
sniffer:
  enable: true
  override-destination: true
  sniff:
    QUIC:
      ports:
      - 443
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
  force-domain:
  - "+.netflix.com"
  - "+.nflxvideo.net"
  - "+.amazonaws.com"
  - "+.media.dssott.com"
  - "+.v2ex.com"
  skip-domain:
  - "+.apple.com"
  - Mijia Cloud
  - dlg.io.mi.com
  - "+.oray.com"
  - "+.sunlogin.net"
  - "+.push.apple.com"
  parse-pure-ip: true
  
# DNS模块
dns:
  cache-algorithm: arc
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - "*.lan"
  - "+.msftconnecttest.com"
  - "+.msftncsi.com"
  - geosite:apple
  - geosite:cn

  
  # namesever尽量用运营商提供的DNS
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
proxy-groups:
  - {name: 🚀 节点选择, type: select, proxies: [🚀 自动选择,♻️ 故障转移, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, 🇺🇸 美国节点]}
  - {name: 🚀 自动选择, type: url-test, include-all: true, filter: "^(?!.*(全球直连)).*", url: "http://cp.cloudflare.com/generate_204", interval: 300, tolerance: 50}
  - {name: ♻️ 故障转移, type: fallback, proxies: [🇯🇵 日本节点, 🇭🇰 香港节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, 🇺🇸 美国节点, 🚀 自动选择], interval: 300, timeout: 2000}
  - {name: 🚀 GitHub, type: fallback, proxies: [🇯🇵 日本节点, 🇭🇰 香港节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, 🇺🇸 美国节点, 🚀 节点选择], url: "http://cp.cloudflare.com/generate_204", interval: 300, timeout: 2000}
  - {name: 📲 Telegram, type: fallback, proxies: [🇸🇬 新加坡节点, 🇯🇵 日本节点, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇺🇸 美国节点, 🚀 节点选择], url: "http://cp.cloudflare.com/generate_204", interval: 300, timeout: 2000}
  - {name: 📺 Bahamut, type: fallback, proxies: [🇹🇼 台湾节点, 🚀 节点选择], url: "http://cp.cloudflare.com/generate_204", interval: 300, timeout: 2000}
  - {name: 🕊️ Twitter(X), type: fallback, proxies: [🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, 🇺🇸 美国节点, 🚀 节点选择], url: "http://cp.cloudflare.com/generate_204", interval: 300, timeout: 2000}
  - {name: 🤖 AI服务, type: fallback, proxies: [🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🚀 节点选择], url: "http://cp.cloudflare.com/generate_204", interval: 300, timeout: 2000}
  - {name: 📹 YouTube, type: fallback, proxies: [🇯🇵 日本节点, 🇭🇰 香港节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, 🇺🇸 美国节点, 🚀 节点选择], url: "http://cp.cloudflare.com/generate_204", interval: 300, timeout: 2000}
  - {name: 🌎 国外媒体, type: fallback, proxies: [🇸🇬 新加坡节点, 🇯🇵 日本节点, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇺🇸 美国节点, 🚀 节点选择], url: "http://cp.cloudflare.com/generate_204", interval: 300, timeout: 2000}
  - {name: 🍎 苹果服务, type: select, proxies: [🎯 全球直连, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, 🇺🇸 美国节点, 🚀 节点选择], url: "http://cp.cloudflare.com/generate_204", interval: 300, timeout: 2000}
  - {name: Ⓜ️ 微软服务, type: select, proxies: [🎯 全球直连, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, 🇺🇸 美国节点, 🚀 节点选择], url: "http://cp.cloudflare.com/generate_204", interval: 300, timeout: 2000}
  - {name: 🇬 谷歌服务, type: fallback, proxies: [🇯🇵 日本节点, 🇭🇰 香港节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, 🇺🇸 美国节点, 🚀 节点选择], url: "http://cp.cloudflare.com/generate_204", interval: 300, timeout: 2000}
  - {name: 🎮 Steam, type: fallback, proxies: [🇭🇰 香港节点, 🇯🇵 日本节点, 🇹🇼 台湾节点, 🚀 节点选择], url: "http://cp.cloudflare.com/generate_204", interval: 300, timeout: 2000}
  - {name: 🎮 游戏平台, type: fallback, proxies: [🇭🇰 香港节点, 🇯🇵 日本节点, 🇹🇼 台湾节点, 🚀 节点选择], url: "http://cp.cloudflare.com/generate_204", interval: 300, timeout: 2000}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🎯 全球直连, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, 🇺🇸 美国节点, 🚀 节点选择]}
  - {name: 🇭🇰 香港节点, type: url-test, include-all: true, filter: "香港|HK", url: "http://cp.cloudflare.com/generate_204", interval: 300, tolerance: 50}
  - {name: 🇯🇵 日本节点, type: url-test, include-all: true, filter: "日本|japan|JP", url: "http://cp.cloudflare.com/generate_204", interval: 300, tolerance: 50}
  - {name: 🇺🇸 美国节点, type: url-test, include-all: true, filter: "美国|US", url: "http://cp.cloudflare.com/generate_204", interval: 300, tolerance: 50}
  - {name: 🇸🇬 新加坡节点, type: url-test, include-all: true, filter: "新加坡|SG", url: "http://cp.cloudflare.com/generate_204", interval: 300, tolerance: 50}
  - {name: 🇹🇼 台湾节点, type: url-test, include-all: true, filter: "台湾|TW", url: "http://cp.cloudflare.com/generate_204", interval: 300, tolerance: 50}
  - {name: 🛑 广告拦截, type: select, proxies: [REJECT, DIRECT]}

